name: Backend CI

on:
  push:
    branches: [ main, master, mem/candidate-512m, fix/collector-session-hard-cap, feat/durable-cohort-cell-aggregates, feat/collector-session-memory-series, feat/scalar-patch-metadata-queries, feat/cached-player-exact-ingestion ]
  pull_request:
    branches: [ main, master, mem/candidate-512m, fix/collector-session-hard-cap, feat/durable-cohort-cell-aggregates ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify public repo free-runner invariant, PostgreSQL binaries, and exact 634e880 + fef2ed6 commit SHAs
      run: |
        test "${{ github.event.repository.private }}" = "false"
        test "${{ github.event.repository.visibility }}" = "public"
        git fetch origin feat/offprod-missing-challenger-identity-completion:refs/remotes/origin/feat/offprod-missing-challenger-identity-completion
        git cat-file -e 634e880b44e2ec7293b46076306774e194f157dc^{commit}
        git cat-file -e fef2ed6d41d82fdac38384974cec6ca0a73e6aae^{commit}
        if [ ! -x /usr/lib/postgresql/16/bin/initdb ] && [ ! -x /usr/lib/postgresql/15/bin/initdb ] && [ ! -x /usr/lib/postgresql/14/bin/initdb ]; then
          PG_INITDB="$(find /usr/lib/postgresql -name initdb 2>/dev/null | head -n 1 || true)"
          if [ -z "$PG_INITDB" ]; then
            sudo apt-get update && sudo apt-get install -y postgresql time
            PG_INITDB="$(find /usr/lib/postgresql -name initdb | head -n 1)"
          fi
          PG_BIN_DIR="$(dirname "$PG_INITDB")"
          sudo mkdir -p /usr/lib/postgresql/16
          sudo ln -sf "$PG_BIN_DIR" /usr/lib/postgresql/16/bin
        fi
        if [ ! -x /usr/bin/time ]; then
          sudo apt-get update && sudo apt-get install -y time
        fi
    - name: Set up JDK 21 for exact 634e880 unit, real PostgreSQL qualification, and standalone timing/RSS proof
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Run isolated 634e880 119-test qualification + standalone CLI timing and OS RSS / 256MiB cgroup proof
      run: |
        git worktree add --detach /tmp/wt-634e880 634e880b44e2ec7293b46076306774e194f157dc
        test "$(git -C /tmp/wt-634e880 rev-parse HEAD)" = "634e880b44e2ec7293b46076306774e194f157dc"

        mkdir -p /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/xml-results
        mkdir -p /tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/xml-results
        mkdir -p /tmp/offprod-qualification-proof-artifacts/sources
        mkdir -p /tmp/offprod-qualification-proof-artifacts/standalone-timing-rss

        git -C /tmp/wt-634e880 diff fef2ed6d41d82fdac38384974cec6ca0a73e6aae..634e880b44e2ec7293b46076306774e194f157dc > /tmp/offprod-qualification-proof-artifacts/source-diff-from-fef2ed6.patch
        git -C /tmp/wt-634e880 show 634e880b44e2ec7293b46076306774e194f157dc > /tmp/offprod-qualification-proof-artifacts/commit-634e880.patch
        FEF_DIFF_BYTES="$(git -C /tmp/wt-634e880 diff fef2ed6d41d82fdac38384974cec6ca0a73e6aae -- src/main/kotlin/com/pride/summoner_searcher_api/tools/OffProdChallengerIdentityCompletionTool.kt src/main/kotlin/com/pride/summoner_searcher_api/tools/OffProdChallengerIdentityCompletionCli.kt src/main/kotlin/com/pride/summoner_searcher_api/repository/PlayerRiotIdentityRepository.kt src/main/kotlin/com/pride/summoner_searcher_api/service/ChallengerLeagueService.kt src/main/resources/db/migration/V11__create_player_riot_identities.sql | wc -c | tr -d ' ')"
        test "$FEF_DIFF_BYTES" = "0"
        echo "CANDIDATE_SHA=634e880b44e2ec7293b46076306774e194f157dc" > /tmp/offprod-qualification-proof-artifacts/fef2ed6-preservation-check.txt
        echo "FEF2ED6_SHA=fef2ed6d41d82fdac38384974cec6ca0a73e6aae" >> /tmp/offprod-qualification-proof-artifacts/fef2ed6-preservation-check.txt
        echo "FEF2ED6_DIFF_BYTE_COUNT=$FEF_DIFF_BYTES" >> /tmp/offprod-qualification-proof-artifacts/fef2ed6-preservation-check.txt

        cp /tmp/wt-634e880/src/main/kotlin/com/pride/summoner_searcher_api/tools/OffProdAdditiveIdentitySchemaSetupCli.kt /tmp/offprod-qualification-proof-artifacts/sources/
        cp /tmp/wt-634e880/src/test/kotlin/com/pride/summoner_searcher_api/tools/OffProdAdditiveIdentitySchemaSetupCliTest.kt /tmp/offprod-qualification-proof-artifacts/sources/
        cp /tmp/wt-634e880/src/main/kotlin/com/pride/summoner_searcher_api/tools/OffProdPrewarmedChallengerIdentityCompletionCli.kt /tmp/offprod-qualification-proof-artifacts/sources/
        cp /tmp/wt-634e880/src/test/kotlin/com/pride/summoner_searcher_api/tools/OffProdPrewarmedChallengerIdentityCompletionCliTest.kt /tmp/offprod-qualification-proof-artifacts/sources/

        chmod +x /tmp/wt-634e880/gradlew
        set +e
        (cd /tmp/wt-634e880 && ./gradlew compileKotlin compileTestKotlin test bootJar --no-daemon --console=plain) > /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.log 2>&1
        TEST_EXIT=$?
        set -e
        echo "$TEST_EXIT" > /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.exit
        cp /tmp/wt-634e880/build/test-results/test/TEST-*.xml /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/xml-results/ || true
        cp /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.exit /tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/test.exit
        cp /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.log /tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/test.log
        cp /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/xml-results/TEST-*.xml /tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/xml-results/ || true

        if [ "$TEST_EXIT" -ne 0 ]; then
          tail -n 120 /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.log
          exit "$TEST_EXIT"
        fi

        mkdir -p /tmp/standalone-runtime
        cp /tmp/wt-634e880/build/libs/summoner-searcher-api-0.0.1-SNAPSHOT.jar /tmp/standalone-runtime/app.jar
        (cd /tmp/standalone-runtime && jar xf app.jar)
        git worktree remove --force /tmp/wt-634e880

        python3 - << 'PYEOF'
        import glob, http.server, json, os, re, shutil, socketserver, subprocess, sys, threading, time, xml.etree.ElementTree as ET

        # 1. Verify 18 XML suites / 119 tests:
        files = sorted(glob.glob("/tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/xml-results/TEST-*.xml"))
        assert len(files) == 18, f"Expected 18 XML suites, got {len(files)}"
        tests = sum(int(ET.parse(f).getroot().attrib["tests"]) for f in files)
        failures = sum(int(ET.parse(f).getroot().attrib["failures"]) for f in files)
        errors = sum(int(ET.parse(f).getroot().attrib["errors"]) for f in files)
        skipped = sum(int(ET.parse(f).getroot().attrib.get("skipped", "0")) for f in files)
        assert tests == 119 and failures == 0 and errors == 0 and skipped == 0

        # 2. Start dedicated off-prod PostgreSQL cluster on port 55432:
        pg_dir = "/tmp/pg-standalone-proof"
        shutil.rmtree(pg_dir, ignore_errors=True)
        os.makedirs(pg_dir, exist_ok=True)
        subprocess.run(["chown", "-R", "postgres:postgres", pg_dir], check=True)
        pg_bin = "/usr/lib/postgresql/16/bin"
        subprocess.run(["sudo", "-u", "postgres", f"{pg_bin}/initdb", "-D", f"{pg_dir}/data", "-A", "trust", "-U", "postgres"], check=True)
        subprocess.run([
            "sudo", "-u", "postgres", f"{pg_bin}/pg_ctl", "-D", f"{pg_dir}/data",
            "-l", f"{pg_dir}/postgres.log", "-o", "-p 55432 -k /tmp", "start"
        ], check=True)

        def run_psql(sql_text):
            subprocess.run(["psql", "-h", "127.0.0.1", "-p", "55432", "-U", "postgres", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-c", sql_text], check=True)

        def query_psql_scalar(sql_text):
            out = subprocess.check_output(["psql", "-h", "127.0.0.1", "-p", "55432", "-U", "postgres", "-d", "postgres", "-t", "-A", "-c", sql_text], text=True)
            return out.strip()

        # Seed public.indexed_players with 409 resolved Challenger rows (269 euw1 + 140 kr) and 0 blank-field conflicts:
        run_psql("""
            CREATE TABLE public.indexed_players (
                puuid VARCHAR(78) PRIMARY KEY,
                game_name VARCHAR(255),
                tag_line VARCHAR(255)
            );
        """)

        def make_puuid(idx):
            prefix = f"puuid_{idx:04d}_"
            return (prefix + ("A" * 78))[:78]

        resolved_rows = []
        for i in range(1, 270):
            resolved_rows.append(f"('{make_puuid(i)}', 'ResolvedEuw_{i}', 'EUW')")
        for i in range(270, 410):
            resolved_rows.append(f"('{make_puuid(i)}', 'ResolvedKr_{i}', 'KR1')")
        run_psql("INSERT INTO public.indexed_players (puuid, game_name, tag_line) VALUES " + ", ".join(resolved_rows) + ";")

        # Create 191-entry missing Challenger manifest (31 euw1 + 160 kr):
        manifest_entries = []
        for i in range(1, 32):
            manifest_entries.append({
                "puuid": make_puuid(1000 + i),
                "platformRegion": "euw1",
                "sourceLeaguePoints": 1500 - i
            })
        for i in range(1, 161):
            manifest_entries.append({
                "puuid": make_puuid(2000 + i),
                "platformRegion": "kr",
                "sourceLeaguePoints": 1800 - i
            })
        assert len(manifest_entries) == 191
        manifest_obj = {
            "snapshotCapturedAtUtc": "2026-11-09T11:34:00Z",
            "entries": manifest_entries
        }
        manifest_path = "/tmp/missing_191_manifest.json"
        with open(manifest_path, "w", encoding="utf-8") as f:
            json.dump(manifest_obj, f, indent=2)

        # 3. Start local loopback Account-V1 HTTP mock server:
        http_req_count = 0
        http_lock = threading.Lock()

        class AccountV1Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                nonlocal http_req_count
                prefix = "/riot/account/v1/accounts/by-puuid/"
                if not self.path.startswith(prefix):
                    self.send_response(404)
                    self.end_headers()
                    return
                puuid = self.path[len(prefix):]
                with http_lock:
                    http_req_count += 1
                    c = http_req_count
                body = json.dumps({
                    "puuid": puuid,
                    "gameName": f"ChallengerPlayer_{c}",
                    "tagLine": "KR1" if "puuid_2" in puuid else "EUW"
                }).encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.send_header("X-App-Rate-Limit", "20:1,100:120")
                self.send_header("X-App-Rate-Limit-Count", "1:1,1:120")
                self.send_header("X-Method-Rate-Limit", "1000:60")
                self.send_header("X-Method-Rate-Limit-Count", "1:60")
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, format, *args):
                pass

        httpd = socketserver.ThreadingTCPServer(("127.0.0.1", 0), AccountV1Handler)
        http_port = httpd.server_address[1]
        http_thread = threading.Thread(target=httpd.serve_forever, daemon=True)
        http_thread.start()
        base_url = f"http://127.0.0.1:{http_port}"

        out_dir = "/tmp/offprod-qualification-proof-artifacts/standalone-timing-rss"
        cp_arg = "/tmp/standalone-runtime/BOOT-INF/classes:/tmp/standalone-runtime/BOOT-INF/lib/*"

        def run_standalone_with_rss(stage_name, main_class, cli_args, env_vars, expected_exit=0):
            time_log = f"{out_dir}/{stage_name}.time.txt"
            stdout_log = f"{out_dir}/{stage_name}.stdout.log"
            cmd = [
                "/usr/bin/time", "-v", "-o", time_log,
                "java", "-Xms16m", "-Xmx96m", "-XX:MaxMetaspaceSize=96m", "-XX:+UseSerialGC",
                "-cp", cp_arg,
                main_class
            ] + cli_args

            full_env = os.environ.copy()
            full_env.update(env_vars)

            t0 = time.monotonic()
            proc = subprocess.Popen(cmd, env=full_env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)

            peak_vm_hwm_kib = 0
            peak_vm_rss_kib = 0
            peak_rss_anon_kib = 0
            peak_rss_file_kib = 0
            proc_samples = 0

            # Find child java PID or monitor proc and its children:
            while proc.poll() is None:
                pids_to_check = [proc.pid]
                try:
                    children = subprocess.check_output(["pgrep", "-P", str(proc.pid)], text=True).split()
                    pids_to_check.extend(int(x) for x in children)
                except Exception:
                    pass
                for pid in pids_to_check:
                    try:
                        status_txt = open(f"/proc/{pid}/status", "r", encoding="utf-8").read()
                        proc_samples += 1
                        for line in status_txt.splitlines():
                            if line.startswith("VmHWM:"):
                                peak_vm_hwm_kib = max(peak_vm_hwm_kib, int(line.split()[1]))
                            elif line.startswith("VmRSS:"):
                                peak_vm_rss_kib = max(peak_vm_rss_kib, int(line.split()[1]))
                            elif line.startswith("RssAnon:"):
                                peak_rss_anon_kib = max(peak_rss_anon_kib, int(line.split()[1]))
                            elif line.startswith("RssFile:"):
                                peak_rss_file_kib = max(peak_rss_file_kib, int(line.split()[1]))
                    except Exception:
                        pass
                time.sleep(0.01)

            stdout_data, _ = proc.communicate()
            wall_ms = round((time.monotonic() - t0) * 1000.0, 2)
            open(stdout_log, "w", encoding="utf-8").write(stdout_data)

            assert proc.returncode == expected_exit, f"Stage {stage_name} expected exit {expected_exit}, got {proc.returncode}: {stdout_data}"

            time_txt = open(time_log, "r", encoding="utf-8").read()
            m_rss = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", time_txt)
            assert m_rss, f"Could not parse Maximum resident set size from {time_txt}"
            ru_maxrss_kib = int(m_rss.group(1))
            effective_peak_rss_kib = max(ru_maxrss_kib, peak_vm_hwm_kib, peak_vm_rss_kib)
            assert effective_peak_rss_kib <= 262144, f"Stage {stage_name} exceeded 256 MiB RSS ceiling: {effective_peak_rss_kib} KiB"

            return {
                "stage": stage_name,
                "mainClass": main_class.split(".")[-1],
                "jvmFlags": ["-Xms16m", "-Xmx96m", "-XX:MaxMetaspaceSize=96m", "-XX:+UseSerialGC"],
                "exitCode": proc.returncode,
                "osWallClockMs": wall_ms,
                "ruMaxRssKiB": ru_maxrss_kib,
                "ruMaxRssMiB": round(ru_maxrss_kib / 1024.0, 2),
                "procVmHwmKiB": peak_vm_hwm_kib,
                "procVmRssKiB": peak_vm_rss_kib,
                "procRssAnonKiB": peak_rss_anon_kib,
                "procRssFileKiB": peak_rss_file_kib,
                "effectivePeakRssKiB": effective_peak_rss_kib,
                "effectivePeakRssMiB": round(effective_peak_rss_kib / 1024.0, 2),
                "rssUnder256MiB": effective_peak_rss_kib <= 262144,
                "procStatusSamplesCollected": proc_samples
            }

        db_env = {
            "OFFPROD_JDBC_URL": "jdbc:postgresql://127.0.0.1:55432/postgres",
            "OFFPROD_DB_USER": "postgres",
            "OFFPROD_DB_PASS": ""
        }
        riot_env = dict(db_env)
        riot_env["OFFPROD_RIOT_API_KEY"] = "TEST-LOOPBACK-STANDALONE-KEY"

        setup_cls = "com.pride.summoner_searcher_api.tools.OffProdAdditiveIdentitySchemaSetupCli"
        comp_cls = "com.pride.summoner_searcher_api.tools.OffProdPrewarmedChallengerIdentityCompletionCli"

        stages = []

        # Stage 1: Setup dry-run precheck before table exists
        s1_rep = f"{out_dir}/stage1_setup_dryrun_pre_ddl.report.json"
        s1_metrics = run_standalone_with_rss(
            "stage1_setup_dryrun_pre_ddl",
            setup_cls,
            [
                "--dry-run=true",
                "--apply-ddl=false",
                "--readiness-timeout-ms=10000",
                "--sql-timeout-ms=2500",
                "--lock-timeout-ms=2000",
                "--max-total-wall-time-ms=15000",
                "--enforce-max-heap-256m=true",
                f"--output-report-file={s1_rep}"
            ],
            db_env,
            expected_exit=0
        )
        s1_json = json.load(open(s1_rep))
        assert s1_json["outcome"] == "DRY_RUN_READINESS_AND_SCHEMA_CHECK_OK"
        assert s1_json["tablePresentBefore"] is False
        assert s1_json["tablePresentAfter"] is False
        assert s1_json["connectionsClosedCleanly"] is True
        s1_metrics["reportSummary"] = {
            "outcome": s1_json["outcome"],
            "ddlCommitStatus": s1_json["ddlCommitStatus"],
            "primaryBackendPid": s1_json["primaryBackendPid"],
            "readinessElapsedMs": s1_json["readinessElapsedMs"],
            "sqlElapsedMs": s1_json["sqlElapsedMs"],
            "cleanupElapsedMs": s1_json["cleanupElapsedMs"],
            "totalWallElapsedMs": s1_json["totalWallElapsedMs"],
            "jvmMaxHeapBytes": s1_json["jvmMaxHeapBytes"],
            "jvmUsedHeapBytesPeak": s1_json["jvmUsedHeapBytesPeak"]
        }
        stages.append(s1_metrics)

        # Stage 2: Setup apply-ddl creating public.player_riot_identities + separate-PID verification
        s2_rep = f"{out_dir}/stage2_setup_apply_ddl.report.json"
        s2_metrics = run_standalone_with_rss(
            "stage2_setup_apply_ddl",
            setup_cls,
            [
                "--apply-ddl=true",
                "--dry-run=false",
                "--allow-ddl-writes=true",
                "--readiness-timeout-ms=10000",
                "--sql-timeout-ms=2500",
                "--lock-timeout-ms=2000",
                "--max-total-wall-time-ms=15000",
                "--enforce-max-heap-256m=true",
                f"--output-report-file={s2_rep}"
            ],
            db_env,
            expected_exit=0
        )
        s2_json = json.load(open(s2_rep))
        assert s2_json["outcome"] == "APPLIED_AND_VERIFIED_DDL"
        assert s2_json["ddlCommitStatus"] == "COMMITTED_AND_VERIFIED"
        assert s2_json["tablePresentBefore"] is False
        assert s2_json["tablePresentAfter"] is True
        assert s2_json["tableShapeValid"] is True
        assert s2_json["primaryBackendPid"] != s2_json["verifyBackendPid"]
        assert s2_json["connectionsClosedCleanly"] is True
        s2_metrics["reportSummary"] = {
            "outcome": s2_json["outcome"],
            "ddlCommitStatus": s2_json["ddlCommitStatus"],
            "primaryBackendPid": s2_json["primaryBackendPid"],
            "verifyBackendPid": s2_json["verifyBackendPid"],
            "readinessElapsedMs": s2_json["readinessElapsedMs"],
            "sqlElapsedMs": s2_json["sqlElapsedMs"],
            "cleanupElapsedMs": s2_json["cleanupElapsedMs"],
            "totalWallElapsedMs": s2_json["totalWallElapsedMs"],
            "jvmMaxHeapBytes": s2_json["jvmMaxHeapBytes"],
            "jvmUsedHeapBytesPeak": s2_json["jvmUsedHeapBytesPeak"]
        }
        stages.append(s2_metrics)

        # Stage 3: Setup post-DDL dry-run idempotency check
        s3_rep = f"{out_dir}/stage3_setup_dryrun_post_ddl.report.json"
        s3_metrics = run_standalone_with_rss(
            "stage3_setup_dryrun_post_ddl",
            setup_cls,
            [
                "--dry-run=true",
                "--apply-ddl=false",
                "--readiness-timeout-ms=10000",
                "--sql-timeout-ms=2500",
                "--lock-timeout-ms=2000",
                "--max-total-wall-time-ms=15000",
                "--enforce-max-heap-256m=true",
                f"--output-report-file={s3_rep}"
            ],
            db_env,
            expected_exit=0
        )
        s3_json = json.load(open(s3_rep))
        assert s3_json["outcome"] == "DRY_RUN_READINESS_AND_SCHEMA_CHECK_OK"
        assert s3_json["tablePresentBefore"] is True
        assert s3_json["tablePresentAfter"] is True
        assert s3_json["tableShapeValid"] is True
        s3_metrics["reportSummary"] = {
            "outcome": s3_json["outcome"],
            "ddlCommitStatus": s3_json["ddlCommitStatus"],
            "primaryBackendPid": s3_json["primaryBackendPid"],
            "readinessElapsedMs": s3_json["readinessElapsedMs"],
            "sqlElapsedMs": s3_json["sqlElapsedMs"],
            "cleanupElapsedMs": s3_json["cleanupElapsedMs"],
            "totalWallElapsedMs": s3_json["totalWallElapsedMs"],
            "jvmMaxHeapBytes": s3_json["jvmMaxHeapBytes"],
            "jvmUsedHeapBytesPeak": s3_json["jvmUsedHeapBytesPeak"]
        }
        stages.append(s3_metrics)

        # Stage 4: Prewarmed Completion CLI dry-run precheck on 191-entry manifest (0 HTTP, 0 writes)
        s4_comp_rep = f"{out_dir}/stage4_completion_dryrun_precheck_191.completion.json"
        s4_wrap_rep = f"{out_dir}/stage4_completion_dryrun_precheck_191.wrapper.json"
        s4_metrics = run_standalone_with_rss(
            "stage4_completion_dryrun_precheck_191",
            comp_cls,
            [
                f"--manifest-file={manifest_path}",
                "--dry-run=true",
                "--network-enabled=false",
                "--allow-durable-writes=false",
                "--readiness-timeout-ms=10000",
                "--db-timeout-ms=2500",
                "--max-wall-time-ms=15000",
                "--enforce-max-heap-256m=true",
                f"--output-report-file={s4_comp_rep}",
                f"--output-wrapper-report-file={s4_wrap_rep}"
            ],
            db_env,
            expected_exit=0
        )
        s4_wjson = json.load(open(s4_wrap_rep))
        s4_cjson = json.load(open(s4_comp_rep))
        assert s4_wjson["physicalConnectionsOpened"] == 1
        assert s4_wjson["connectionsClosedCleanly"] is True
        assert s4_cjson["outcome"] == "DRY_RUN_DB_RECHECK_ONLY_COMPLETED"
        assert s4_cjson["httpAttemptsMade"] == 0
        assert s4_cjson["absentFromIndexedPlayersCount"] == 191
        assert s4_cjson["presentWithBlankFieldInIndexedPlayersCount"] == 0
        s4_metrics["reportSummary"] = {
            "outcome": s4_cjson["outcome"],
            "physicalConnectionsOpened": s4_wjson["physicalConnectionsOpened"],
            "readVerifyBackendPid": s4_wjson["readVerifyBackendPid"],
            "absentFromIndexedPlayersCount": s4_cjson["absentFromIndexedPlayersCount"],
            "alreadyResolvedInDbCount": s4_cjson["alreadyResolvedInDbCount"],
            "httpAttemptsMade": s4_cjson["httpAttemptsMade"],
            "readinessElapsedMs": s4_wjson["readinessElapsedMs"],
            "runStageElapsedMs": s4_wjson["runStageElapsedMs"],
