name: Backend CI

on:
  push:
    branches: [ main, master, mem/candidate-512m, fix/collector-session-hard-cap, feat/durable-cohort-cell-aggregates, feat/collector-session-memory-series, feat/scalar-patch-metadata-queries, feat/cached-player-exact-ingestion, test/issue-39-cs10-512m-proof-2451e9f ]
  pull_request:
    branches: [ main, master, mem/candidate-512m, fix/collector-session-hard-cap, feat/durable-cohort-cell-aggregates ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Detach exact candidate 2451e9f worktree and verify diff is ci.yml-only
      run: |
        CAND_SHA="2451e9ff66d1f363ac9a870166c2ba4da32fe014"
        test "$(git diff --name-only "$CAND_SHA" HEAD)" = ".github/workflows/ci.yml"
        git worktree add --detach /tmp/wt-2451e9f "$CAND_SHA"
        test "$(git -C /tmp/wt-2451e9f rev-parse HEAD)" = "$CAND_SHA"
        chmod +x /tmp/wt-2451e9f/gradlew /tmp/wt-2451e9f/scripts/preflight.sh
    - name: Run shared preflight on exact candidate 2451e9f (compileKotlin compileTestKotlin + full test)
      working-directory: /tmp/wt-2451e9f
      run: ./scripts/preflight.sh
    - name: Run Real 512 MB Container Proof on Exact Candidate 2451e9f Dockerfile (--memory=512m --memory-swap=512m) [Strict <78% Gate]
      if: github.ref == 'refs/heads/test/issue-39-cs10-512m-proof-2451e9f' || github.ref == 'refs/heads/mem/candidate-512m'
      run: |
        CAND_SHA="2451e9ff66d1f363ac9a870166c2ba4da32fe014"
        test "$(git -C /tmp/wt-2451e9f rev-parse HEAD)" = "$CAND_SHA"
        PG_FIXTURE_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
        test "${#PG_FIXTURE_PASSWORD}" -eq 48
        POSTGRES_PASSWORD="$PG_FIXTURE_PASSWORD" docker run -d --name ss-postgres -p 5432:5432 -e POSTGRES_PASSWORD -e POSTGRES_DB=summoner_searcher postgres:16-alpine
        docker run -d --name ss-redis -p 6379:6379 redis:7-alpine
        docker build -f /tmp/wt-2451e9f/Dockerfile -t ss-backend:512m-proof /tmp/wt-2451e9f
        openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/mockriot.key -out /tmp/mockriot.crt -days 1 \
          -subj "/CN=api.riotgames.com" \
          -addext "subjectAltName=DNS:euw1.api.riotgames.com,DNS:na1.api.riotgames.com,DNS:kr.api.riotgames.com,DNS:europe.api.riotgames.com,DNS:americas.api.riotgames.com,DNS:asia.api.riotgames.com,DNS:ddragon.leagueoflegends.com"
        cid=$(docker create ss-backend:512m-proof)
        docker cp "$cid:/opt/java/openjdk/lib/security/cacerts" /tmp/cacerts
        docker rm "$cid"
        keytool -importcert -noprompt -trustcacerts -alias mockriot -file /tmp/mockriot.crt -keystore /tmp/cacerts -storepass changeit
        chmod 644 /tmp/cacerts
        PROOF_MODE=10_CYCLE ENABLE_NMT=0 DB_PASS="$PG_FIXTURE_PASSWORD" sudo --preserve-env=PROOF_MODE,ENABLE_NMT,DB_PASS python3 /tmp/wt-2451e9f/scripts/verify_512m_container.py /tmp/mockriot.crt /tmp/mockriot.key
