name: Backend CI

on:
  push:
    branches: [ main, master, mem/candidate-512m, fix/collector-session-hard-cap, feat/durable-cohort-cell-aggregates, feat/collector-session-memory-series, feat/scalar-patch-metadata-queries, feat/cached-player-exact-ingestion ]
  pull_request:
    branches: [ main, master, mem/candidate-512m, fix/collector-session-hard-cap, feat/durable-cohort-cell-aggregates ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify public repo free-runner invariant, PostgreSQL binaries, and exact 634e880 + fef2ed6 commit SHAs
      run: |
        test "${{ github.event.repository.private }}" = "false"
        test "${{ github.event.repository.visibility }}" = "public"
        git fetch origin feat/offprod-missing-challenger-identity-completion:refs/remotes/origin/feat/offprod-missing-challenger-identity-completion
        git cat-file -e 634e880b44e2ec7293b46076306774e194f157dc^{commit}
        git cat-file -e fef2ed6d41d82fdac38384974cec6ca0a73e6aae^{commit}
        if [ ! -x /usr/lib/postgresql/16/bin/initdb ] && [ ! -x /usr/lib/postgresql/15/bin/initdb ] && [ ! -x /usr/lib/postgresql/14/bin/initdb ]; then
          PG_INITDB="$(find /usr/lib/postgresql -name initdb 2>/dev/null | head -n 1 || true)"
          if [ -z "$PG_INITDB" ]; then
            sudo apt-get update && sudo apt-get install -y postgresql
            PG_INITDB="$(find /usr/lib/postgresql -name initdb | head -n 1)"
          fi
          PG_BIN_DIR="$(dirname "$PG_INITDB")"
          sudo mkdir -p /usr/lib/postgresql/16
          sudo ln -sf "$PG_BIN_DIR" /usr/lib/postgresql/16/bin
        fi
    - name: Set up JDK 21 for exact 634e880 unit and real PostgreSQL qualification test verification
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Run isolated 634e880 JDK 21 + real PostgreSQL qualification and capture raw logs, XML, and source-diff proof
      run: |
        git worktree add --detach /tmp/wt-634e880 634e880b44e2ec7293b46076306774e194f157dc
        test "$(git -C /tmp/wt-634e880 rev-parse HEAD)" = "634e880b44e2ec7293b46076306774e194f157dc"

        mkdir -p /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/xml-results
        mkdir -p /tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/xml-results
        mkdir -p /tmp/offprod-qualification-proof-artifacts/sources

        git -C /tmp/wt-634e880 diff fef2ed6d41d82fdac38384974cec6ca0a73e6aae..634e880b44e2ec7293b46076306774e194f157dc > /tmp/offprod-qualification-proof-artifacts/source-diff-from-fef2ed6.patch
        git -C /tmp/wt-634e880 show 634e880b44e2ec7293b46076306774e194f157dc > /tmp/offprod-qualification-proof-artifacts/commit-634e880.patch
        FEF_DIFF_BYTES="$(git -C /tmp/wt-634e880 diff fef2ed6d41d82fdac38384974cec6ca0a73e6aae -- src/main/kotlin/com/pride/summoner_searcher_api/tools/OffProdChallengerIdentityCompletionTool.kt src/main/kotlin/com/pride/summoner_searcher_api/tools/OffProdChallengerIdentityCompletionCli.kt src/main/kotlin/com/pride/summoner_searcher_api/repository/PlayerRiotIdentityRepository.kt src/main/kotlin/com/pride/summoner_searcher_api/service/ChallengerLeagueService.kt src/main/resources/db/migration/V11__create_player_riot_identities.sql | wc -c | tr -d ' ')"
        test "$FEF_DIFF_BYTES" = "0"
        echo "CANDIDATE_SHA=634e880b44e2ec7293b46076306774e194f157dc" > /tmp/offprod-qualification-proof-artifacts/fef2ed6-preservation-check.txt
        echo "FEF2ED6_SHA=fef2ed6d41d82fdac38384974cec6ca0a73e6aae" >> /tmp/offprod-qualification-proof-artifacts/fef2ed6-preservation-check.txt
        echo "FEF2ED6_DIFF_BYTE_COUNT=$FEF_DIFF_BYTES" >> /tmp/offprod-qualification-proof-artifacts/fef2ed6-preservation-check.txt

        cp /tmp/wt-634e880/src/main/kotlin/com/pride/summoner_searcher_api/tools/OffProdAdditiveIdentitySchemaSetupCli.kt /tmp/offprod-qualification-proof-artifacts/sources/
        cp /tmp/wt-634e880/src/test/kotlin/com/pride/summoner_searcher_api/tools/OffProdAdditiveIdentitySchemaSetupCliTest.kt /tmp/offprod-qualification-proof-artifacts/sources/
        cp /tmp/wt-634e880/src/main/kotlin/com/pride/summoner_searcher_api/tools/OffProdPrewarmedChallengerIdentityCompletionCli.kt /tmp/offprod-qualification-proof-artifacts/sources/
        cp /tmp/wt-634e880/src/test/kotlin/com/pride/summoner_searcher_api/tools/OffProdPrewarmedChallengerIdentityCompletionCliTest.kt /tmp/offprod-qualification-proof-artifacts/sources/

        chmod +x /tmp/wt-634e880/gradlew
        set +e
        (cd /tmp/wt-634e880 && ./gradlew compileKotlin compileTestKotlin test --no-daemon --console=plain) > /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.log 2>&1
        TEST_EXIT=$?
        set -e
        echo "$TEST_EXIT" > /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.exit
        cp /tmp/wt-634e880/build/test-results/test/TEST-*.xml /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/xml-results/ || true
        cp /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.exit /tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/test.exit
        cp /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.log /tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/test.log
        cp /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/xml-results/TEST-*.xml /tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/xml-results/ || true
        git worktree remove --force /tmp/wt-634e880

        if [ "$TEST_EXIT" -ne 0 ]; then
          tail -n 120 /tmp/offprod-qualification-proof-raw/jdk21-test-634e880/test.log
          exit "$TEST_EXIT"
        fi
        python3 -c '
        import glob, json, xml.etree.ElementTree as ET
        files = sorted(glob.glob("/tmp/offprod-qualification-proof-artifacts/jdk21-test-634e880/xml-results/TEST-*.xml"))
        assert len(files) == 18, f"Expected 18 XML suites, got {len(files)}"
        tests = sum(int(ET.parse(f).getroot().attrib["tests"]) for f in files)
        failures = sum(int(ET.parse(f).getroot().attrib["failures"]) for f in files)
        errors = sum(int(ET.parse(f).getroot().attrib["errors"]) for f in files)
        skipped = sum(int(ET.parse(f).getroot().attrib.get("skipped", "0")) for f in files)
        assert tests == 119 and failures == 0 and errors == 0 and skipped == 0, f"Unexpected counts: tests={tests}, failures={failures}, errors={errors}, skipped={skipped}"
        summary = {
            "candidateSha": "634e880b44e2ec7293b46076306774e194f157dc",
            "preservedFef2ed6Sha": "fef2ed6d41d82fdac38384974cec6ca0a73e6aae",
            "fef2ed6DiffBytes": 0,
            "xmlSuitesCount": len(files),
            "totalTests": tests,
            "failures": failures,
            "errors": errors,
            "skipped": skipped,
        }
        open("/tmp/offprod-qualification-proof-artifacts/qualification_summary.json", "w", encoding="utf-8").write(json.dumps(summary, indent=2) + "\n")
        '
    - name: Sanitize and verify zero secrets in upload directory on all paths
      id: artifact_gate
      if: always()
      run: |
        sudo python3 - << 'PYEOF'
        import json, os, re, shutil, sys
        upload_dir = "/tmp/offprod-qualification-proof-artifacts"
        if not os.path.isdir(upload_dir):
            print("Upload directory does not exist; failing closed.", file=sys.stderr)
            sys.exit(1)
        redact_patterns = [
            re.compile(r"RGAPI-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"),
            re.compile(r"\bre_[0-9a-zA-Z_]{16,}\b"),
            re.compile(r"\bgh[pousr]_[0-9a-zA-Z]{20,}\b"),
            re.compile(r"\bgithub_pat_[0-9a-zA-Z_]{20,}\b"),
        ]
        file_count = 0
        for root, _dirs, files in os.walk(upload_dir):
            for fname in files:
                fpath = os.path.join(root, fname)
                if not os.path.isfile(fpath):
                    continue
                file_count += 1
                text = open(fpath, "r", encoding="utf-8", errors="replace").read()
                for pat in redact_patterns:
                    if pat.search(text):
                        shutil.rmtree(upload_dir, ignore_errors=True)
                        raise RuntimeError(f"SECRET_REGEX_SCAN_GATE_FAILED in {fpath} matching {pat.pattern}")
                if fname.endswith(".json"):
                    try:
                        json.loads(text)
                    except Exception as e:
                        shutil.rmtree(upload_dir, ignore_errors=True)
                        raise RuntimeError(f"INVALID_JSON_ARTIFACT in {fpath}: {e}")
        if file_count == 0:
            shutil.rmtree(upload_dir, ignore_errors=True)
            raise RuntimeError("EMPTY_UPLOAD_DIRECTORY")
        print(f"Verified {file_count} sanitized artifact files with 0 secret leaks.")
        PYEOF
    - name: Upload Sanitized Off-Prod Qualification Proof (Raw Logs, 18 XML Suites, Source-Diff)
      if: always() && steps.artifact_gate.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: offprod-qualification-proof-634e880
        path: /tmp/offprod-qualification-proof-artifacts
        if-no-files-found: error
        retention-days: 7
