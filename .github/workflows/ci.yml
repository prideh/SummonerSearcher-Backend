name: Backend CI

on:
  push:
    branches: [ main, master, mem/candidate-512m, fix/collector-session-hard-cap, feat/durable-cohort-cell-aggregates, feat/collector-session-memory-series, feat/scalar-patch-metadata-queries, feat/cached-player-exact-ingestion ]
  pull_request:
    branches: [ main, master, mem/candidate-512m, fix/collector-session-hard-cap, feat/durable-cohort-cell-aggregates ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify public repo free-runner invariant and exact fef2ed6 + 5959a70 + 139a7de commit SHAs
      run: |
        test "${{ github.event.repository.private }}" = "false"
        test "${{ github.event.repository.visibility }}" = "public"
        git fetch origin feat/offprod-missing-challenger-identity-completion:refs/remotes/origin/feat/offprod-missing-challenger-identity-completion || true
        git cat-file -e fef2ed6d41d82fdac38384974cec6ca0a73e6aae^{commit}
        git cat-file -e 5959a7036c9e281f72d17f0a0bd5003ba59476f8^{commit}
        git cat-file -e 139a7de48e67af9d664c08fd61ce131b6e63bd74^{commit}
    - name: Set up JDK 21 for exact fef2ed6 unit and PostgreSQL qualification test verification
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build exact Integrated Candidate (fef2ed6) and Rollback Base (139a7de) Docker images and capture 104-test JDK 21 XML/exit evidence from detached worktrees
      run: |
        git worktree add --detach /tmp/wt-fef2ed6 fef2ed6d41d82fdac38384974cec6ca0a73e6aae
        test "$(git -C /tmp/wt-fef2ed6 rev-parse HEAD)" = "fef2ed6d41d82fdac38384974cec6ca0a73e6aae"
        docker build -f /tmp/wt-fef2ed6/Dockerfile -t ss-backend:cand-fef2ed6 /tmp/wt-fef2ed6
        docker tag ss-backend:cand-fef2ed6 ss-backend:512m-proof

        mkdir -p /tmp/challenger-leaderboard-512m-proof-raw/jdk21-test-fef2ed6/xml-results
        mkdir -p /tmp/challenger-leaderboard-512m-proof-artifacts/jdk21-test-fef2ed6/xml-results
        chmod +x /tmp/wt-fef2ed6/gradlew
        set +e
        (cd /tmp/wt-fef2ed6 && ./gradlew compileKotlin compileTestKotlin test --no-daemon --console=plain) > /tmp/challenger-leaderboard-512m-proof-raw/jdk21-test-fef2ed6/test.log 2>&1
        TEST_EXIT=$?
        set -e
        echo "$TEST_EXIT" > /tmp/challenger-leaderboard-512m-proof-raw/jdk21-test-fef2ed6/test.exit
        cp /tmp/wt-fef2ed6/build/test-results/test/TEST-*.xml /tmp/challenger-leaderboard-512m-proof-raw/jdk21-test-fef2ed6/xml-results/ || true
        cp /tmp/challenger-leaderboard-512m-proof-raw/jdk21-test-fef2ed6/test.exit /tmp/challenger-leaderboard-512m-proof-artifacts/jdk21-test-fef2ed6/test.exit
        cp /tmp/challenger-leaderboard-512m-proof-raw/jdk21-test-fef2ed6/test.log /tmp/challenger-leaderboard-512m-proof-artifacts/jdk21-test-fef2ed6/test.log
        cp /tmp/challenger-leaderboard-512m-proof-raw/jdk21-test-fef2ed6/xml-results/TEST-*.xml /tmp/challenger-leaderboard-512m-proof-artifacts/jdk21-test-fef2ed6/xml-results/ || true
        git worktree remove --force /tmp/wt-fef2ed6

        if [ "$TEST_EXIT" -ne 0 ]; then
          tail -n 120 /tmp/challenger-leaderboard-512m-proof-raw/jdk21-test-fef2ed6/test.log
          exit "$TEST_EXIT"
        fi
        python3 -c '
        import glob, xml.etree.ElementTree as ET
        files = sorted(glob.glob("/tmp/challenger-leaderboard-512m-proof-artifacts/jdk21-test-fef2ed6/xml-results/TEST-*.xml"))
        assert len(files) == 16, f"Expected 16 XML suites, got {len(files)}"
        tests = sum(int(ET.parse(f).getroot().attrib["tests"]) for f in files)
        failures = sum(int(ET.parse(f).getroot().attrib["failures"]) for f in files)
        errors = sum(int(ET.parse(f).getroot().attrib["errors"]) for f in files)
        skipped = sum(int(ET.parse(f).getroot().attrib.get("skipped", "0")) for f in files)
        assert tests == 104 and failures == 0 and errors == 0 and skipped == 0, f"Unexpected counts: tests={tests}, failures={failures}, errors={errors}, skipped={skipped}"
        '

        git worktree add --detach /tmp/wt-139a7de 139a7de48e67af9d664c08fd61ce131b6e63bd74
        docker build -f /tmp/wt-139a7de/Dockerfile -t ss-backend:base-139a7de /tmp/wt-139a7de
        git worktree remove --force /tmp/wt-139a7de
    - name: Prepare local Mock Riot TLS certificate and container truststore
      run: |
        openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/mockriot.key -out /tmp/mockriot.crt -days 1 \
          -subj "/CN=api.riotgames.com" \
          -addext "subjectAltName=DNS:euw1.api.riotgames.com,DNS:na1.api.riotgames.com,DNS:kr.api.riotgames.com,DNS:europe.api.riotgames.com,DNS:americas.api.riotgames.com,DNS:asia.api.riotgames.com,DNS:ddragon.leagueoflegends.com"
        cid=$(docker create ss-backend:cand-fef2ed6)
        docker cp "$cid:/opt/java/openjdk/lib/security/cacerts" /tmp/cacerts
        docker rm "$cid"
        keytool -importcert -noprompt -trustcacerts -alias mockriot -file /tmp/mockriot.crt -keystore /tmp/cacerts -storepass changeit
        chmod 644 /tmp/cacerts
    - name: Run Real 512 MiB Container Acceptance Proof (Integrated Candidate fef2ed6 + Rollback 139a7de)
      run: |
        chmod +x scripts/verify_512m_container.py
        python3 ./scripts/verify_512m_container.py --self-test
        CAND_IMAGE="ss-backend:cand-fef2ed6" BASE_IMAGE="ss-backend:base-139a7de" \
        RAW_ARTIFACT_DIR="/tmp/challenger-leaderboard-512m-proof-raw" \
        ARTIFACT_DIR="/tmp/challenger-leaderboard-512m-proof-artifacts" \
          sudo --preserve-env=CAND_IMAGE,BASE_IMAGE,RAW_ARTIFACT_DIR,ARTIFACT_DIR python3 ./scripts/verify_512m_container.py /tmp/mockriot.crt /tmp/mockriot.key
    - name: Sanitize and verify zero secrets in upload directory on all paths
      id: artifact_gate
      if: always()
      run: |
        sudo python3 - << 'PYEOF'
        import json, os, re, shutil, sys
        raw_dir = "/tmp/challenger-leaderboard-512m-proof-raw"
        upload_dir = "/tmp/challenger-leaderboard-512m-proof-artifacts"
        if not os.path.isdir(upload_dir):
            print("Upload directory does not exist; failing closed.", file=sys.stderr)
            sys.exit(1)
        forbidden_tokens = []
        secrets_manifest = os.path.join(raw_dir, ".ephemeral_secrets.json")
        if os.path.isfile(secrets_manifest):
            forbidden_tokens = [t for t in json.load(open(secrets_manifest, "r", encoding="utf-8")) if t]
        redact_patterns = [
            re.compile(r"RGAPI-[0-9a-fA-F-]{16,}"),
            re.compile(r"\bre_[0-9a-zA-Z_]{16,}\b"),
            re.compile(r"\bgh[pousr]_[0-9a-zA-Z]{20,}\b"),
            re.compile(r"\bgithub_pat_[0-9a-zA-Z_]{20,}\b"),
            re.compile(r'(?i)((?:db_pass|postgres_password|jwt_secret_key|twofa_secret_key|cohort_operator_token|riot_api_key|resend_api_key)\s*[=:]\s*)(?!\[REDACTED\])[^\s"\',;<>\]}]+'),
        ]
        jdk_upload_dir = os.path.join(upload_dir, "jdk21-test-fef2ed6")
        if os.path.isdir(jdk_upload_dir):
            for root, _dirs, files in os.walk(jdk_upload_dir):
                for fname in files:
                    fpath = os.path.join(root, fname)
                    if not os.path.isfile(fpath):
                        continue
                    text = open(fpath, "r", encoding="utf-8", errors="replace").read()
                    orig = text
                    for tok in forbidden_tokens:
                        text = text.replace(tok, "[REDACTED]")
                    for pat in redact_patterns[:4]:
                        text = pat.sub("[REDACTED]", text)
                    text = redact_patterns[4].sub(r"\1[REDACTED]", text)
                    if text != orig:
                        open(fpath, "w", encoding="utf-8").write(text)
        file_count = 0
        for root, _dirs, files in os.walk(upload_dir):
            for fname in files:
                fpath = os.path.join(root, fname)
                if not os.path.isfile(fpath):
                    continue
                file_count += 1
                text = open(fpath, "r", encoding="utf-8", errors="replace").read()
                for tok in forbidden_tokens:
                    if tok in text:
                        shutil.rmtree(upload_dir, ignore_errors=True)
                        raise RuntimeError(f"SECRET_TOKEN_SCAN_GATE_FAILED in {fpath}")
                for pat in redact_patterns:
                    if pat.search(text):
                        shutil.rmtree(upload_dir, ignore_errors=True)
                        raise RuntimeError(f"SECRET_REGEX_SCAN_GATE_FAILED in {fpath} matching {pat.pattern}")
                if fname.endswith(".json"):
                    try:
                        json.loads(text)
                    except Exception as e:
                        shutil.rmtree(upload_dir, ignore_errors=True)
                        raise RuntimeError(f"INVALID_JSON_ARTIFACT in {fpath}: {e}")
        if file_count == 0:
            shutil.rmtree(upload_dir, ignore_errors=True)
            raise RuntimeError("EMPTY_UPLOAD_DIRECTORY")
        print(f"Verified {file_count} sanitized artifact files with 0 secret leaks.")
        PYEOF
    - name: Upload Sanitized 512 MiB Challenger Leaderboard Proof & 104-Test XML/Exit Evidence Artifacts
      if: always() && steps.artifact_gate.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: challenger-leaderboard-512m-proof-fef2ed6
        path: /tmp/challenger-leaderboard-512m-proof-artifacts
        if-no-files-found: error
        retention-days: 7
