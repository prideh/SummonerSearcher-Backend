name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew and preflight script
      run: chmod +x gradlew scripts/preflight.sh
    - name: Run shared preflight (compileKotlin compileTestKotlin + full test)
      run: ./scripts/preflight.sh
