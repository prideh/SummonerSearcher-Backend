services:
  # This is your Spring Boot app
  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
  # This is your React app
  frontend:
    build: ../frontend
    ports:
      # Connects your computer's port 3000 to the container's port 80
      - "3000:80"
    # This makes sure the backend starts first
    depends_on:
      - backend
  redis:
    image: redis:alpine
    command: >
      sh -c "
      if [ -z \"$REDIS_PASSWORD\" ]; then
        redis-server
      else
        redis-server --requirepass \"$REDIS_PASSWORD\"
      fi
      "
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data

  # --- ADD THIS ENTIRE SERVICE ---
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-mysecretpassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
