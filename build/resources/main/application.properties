# ===================================================================
# Master Configuration File
#
# This file contains all configuration for the application.
# It uses environment variables with sensible defaults for local development.
# In production, all placeholders should be replaced by environment variables.
# ===================================================================

# --- Spring Boot General ---
spring.application.name=summoner-searcher-api
server.port=${PORT:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# --- Import .env file ---
spring.config.import=optional:file:./.env[.properties]

# --- Spring Profiles ---
# Set the default profile to 'dev'. In production, this is overridden
# by the 'SPRING_PROFILES_ACTIVE=prod' environment variable.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Dummy User Configuration ---
dummy.user.email=dummy@summonersearcher.com

# --- PostgreSQL Configuration ---
# In production, set DB_HOST, DB_PORT, DB_NAME, DB_USER, and DB_PASS environment variables.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?characterEncoding=UTF-8
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:mysecretpassword}
spring.jpa.hibernate.ddl-auto=update

# --- JPA Performance ---
# Disable Open-in-View as it's an anti-pattern for REST APIs
spring.jpa.open-in-view=false

# --- Redis Configuration ---
# In production, set the single REDIS_URL environment variable provided by your host.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# --- Application Secrets (MUST be set in production) ---
riotApiKey=${RIOT_API_KEY}
jwt.secret=${JWT_SECRET_KEY}
two-factor.encryption.key=${TWOFA_SECRET_KEY}
SENDGRID_API_KEY=${SENDGRID_API_KEY}
GEMINI_API_KEY=${GEMINI_API_KEY:}

# --- CORS Configuration ---
# Use CORS_ORIGINS environment variable in production (e.g., "https://your-frontend-domain.com")
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Email Configuration (SendGrid) ---
# In production, set SENDGRID_API_KEY and SENDGRID_FROM_EMAIL environment variables.
sendgrid.from.email=${SENDGRID_FROM_EMAIL:no-reply@example.com}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}