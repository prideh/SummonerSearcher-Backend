# ===================================================================
# Master Configuration File
#
# This file contains all configuration for the application.
# It uses environment variables with sensible defaults for local development.
# In production, all placeholders should be replaced by environment variables.
# ===================================================================

# --- Spring Boot General ---
spring.application.name=summoner-searcher-api

# --- PostgreSQL Configuration ---
# Use DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS environment variables in production
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?characterEncoding=UTF-8
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:mysecretpassword}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- Redis Configuration ---
# Use REDIS_HOST, REDIS_PORT environment variables in production
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Application Secrets (MUST be set in production) ---
riotApiKey=${RIOT_API_KEY}
jwt.secret=${JWT_SECRET_KEY}
two-factor.encryption.key=${2FA_SECRET_KEY}

# --- CORS Configuration ---
# Use CORS_ORIGINS environment variable in production (e.g., "https://your-frontend-domain.com")
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Email Configuration ---
# These should be set as environment variables in production
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:nasserzdeh@gmail.com}
spring.mail.password=${MAIL_PASS:hrtq wwfw enlf jgpv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
