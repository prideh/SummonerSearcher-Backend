# ===================================================================
# Master Configuration File
#
# This file contains all configuration for the application.
# It uses environment variables with sensible defaults for local development.
# In production, all placeholders should be replaced by environment variables.
# ===================================================================

# --- Spring Boot General ---
spring.application.name=summoner-searcher-api

# --- PostgreSQL Configuration ---
# In production, set the single DATABASE_URL environment variable provided by your host.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:mysecretpassword}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- Redis Configuration ---
# In production, set the single REDIS_URL environment variable provided by your host.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# --- Application Secrets (MUST be set in production) ---
riotApiKey=${RIOT_API_KEY}
jwt.secret=${JWT_SECRET_KEY}
two-factor.encryption.key=${TWOFA_SECRET_KEY}

# --- CORS Configuration ---
# Use CORS_ORIGINS environment variable in production (e.g., "https://your-frontend-domain.com")
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Email Configuration ---
# These should be set as environment variables in production
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:nasserzdeh@gmail.com}
spring.mail.password=${MAIL_PASS:hrtq wwfw enlf jgpv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
