# Test Configuration
spring.application.name=summoner-searcher-api
server.port=8080
app.frontend.url=http://localhost:5173



# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Redis autoconfiguration for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Dummy values for required properties
riotApiKey=dummy-key
jwt.secret=dummy-secret-key-that-is-long-enough-for-the-algorithm
two-factor.encryption.key=another-dummy-secret-key-for-2fa-encryption
SENDGRID_API_KEY=dummy-sendgrid-key
sendgrid.from.email=no-reply@example.com
jwt.cookie.secure=false
cors.allowed-origins=http://localhost:5173
